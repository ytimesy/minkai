<svg width="1920" height="1080" viewBox="0 0 1920 1080" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Dwarven forge background">
  <defs>
    <linearGradient id="stone" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#1d1714"/>
      <stop offset="0.45" stop-color="#3a2a20"/>
      <stop offset="1" stop-color="#130f0d"/>
    </linearGradient>
    <linearGradient id="fire" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0" stop-color="#ffd77a"/>
      <stop offset="0.32" stop-color="#e06b2b"/>
      <stop offset="0.72" stop-color="#7f2719"/>
      <stop offset="1" stop-color="#21100c"/>
